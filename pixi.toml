[workspace]
name = "coding-course"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = ">=3.12,<3.14"
numpy = ">=2"
pandas = ">=2"
matplotlib = ">=3.8"
jupyterlab = ">=4"
notebook = ">=7"
ipykernel = ">=6"
xarray = ">=2024.10.0"
netcdf4 = ">=1.7"
rioxarray = ">=0.17"
rasterio = ">=1.4"
pyproj = ">=3.6"
regionmask = ">=0.12"
scipy = ">=1.14"
geopandas = ">=1.0"
dask = ">=2024.10.0"

[tasks]
lab = "jupyter lab"
notebook = "jupyter notebook"
install-kernel = "python -m ipykernel install --user --name coding-course --display-name 'Python (Future Forests course)'"
